name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lint & Test
        run: echo "Running lint and tests..."

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Images (API, Worker, Relay, Frontend)
        run: |
          docker build -t doc2pdf-api:latest ./api
          docker build -t doc2pdf-worker:latest ./worker
          docker build -t doc2pdf-relay:latest ./relay
          docker build -t doc2pdf-frontend:latest ./frontend

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ACR_LOGIN_SERVER != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag and Push Images to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ACR_LOGIN_SERVER != ''
        run: |
          for svc in api worker relay frontend; do
            docker tag doc2pdf-${svc}:latest ${{ secrets.ACR_LOGIN_SERVER }}/doc2pdf-${svc}:${{ github.sha }}
            docker tag doc2pdf-${svc}:latest ${{ secrets.ACR_LOGIN_SERVER }}/doc2pdf-${svc}:latest
            docker push ${{ secrets.ACR_LOGIN_SERVER }}/doc2pdf-${svc}:${{ github.sha }}
            docker push ${{ secrets.ACR_LOGIN_SERVER }}/doc2pdf-${svc}:latest
          done
