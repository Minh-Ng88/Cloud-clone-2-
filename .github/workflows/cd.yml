name: CD Deploy to Azure

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-azure:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
    steps:
      - name: Azure Login
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Credentials
        if: env.AZURE_CREDENTIALS != ''
        run: |
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASS"
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "ACR_PASS=$ACR_PASS" >> $GITHUB_ENV

      - name: Update Container App API
        if: env.AZURE_CREDENTIALS != ''
        run: |
          az containerapp up \
            --name ca-doc2pdf-api \
            --resource-group rg-doc2pdf-dev \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/doc2pdf-api:latest \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username "$ACR_NAME" \
            --registry-password "$ACR_PASS"

      - name: Update Container App Relay
        if: env.AZURE_CREDENTIALS != ''
        run: |
          az containerapp up \
            --name ca-doc2pdf-relay \
            --resource-group rg-doc2pdf-dev \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/doc2pdf-relay:latest \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username "$ACR_NAME" \
            --registry-password "$ACR_PASS"

      - name: Update Container Apps Job Worker
        if: env.AZURE_CREDENTIALS != ''
        run: |
          az containerapp up \
            --name job-doc2pdf-worker \
            --resource-group rg-doc2pdf-dev \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/doc2pdf-worker:latest \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username "$ACR_NAME" \
            --registry-password "$ACR_PASS"
