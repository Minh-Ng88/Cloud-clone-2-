# Hạ tầng cục bộ thay cho dịch vụ cloud (chạy: docker compose up -d)
# Postgres = RDS/Cloud SQL | MinIO = S3/Cloud Storage | RabbitMQ = SQS/Pub/Sub

services:
  frontend:
    build:
      context: ./frontend/job_detail/frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: doc2pdf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:latest
    container_name: doc2pdf-s3
    command: server -s3 -dir=/data -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports:
      - "${S3_PORT}:8333"
    volumes:
      - s3_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: doc2pdf-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Bật lại khi Khôi/Lộc có Dockerfile ---
