  #   ports: ["8000:8000"]
  #
  # worker:
  #   build: ./worker
  #   env_file: .env
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     rabbitmq: { condition: service_healthy }

volumes:
  postgres_data:
  s3_data:
  rabbitmq_data: